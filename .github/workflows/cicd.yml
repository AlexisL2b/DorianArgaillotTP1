# DOC: https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
name: Build the app docker image

on:
  push:
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      imageRepository: ${{ steps.versioning.outputs.imageRepository }}
      imageName: ${{ steps.versioning.outputs.imageName }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute versions
        id: versioning
        run: |
          version=$(git rev-parse --short HEAD)
          repository=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          imageRepository=ghcr.io/$repository
          imageName=$imageRepository:$version
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "imageRepository=$imageRepository" >> $GITHUB_OUTPUT
          echo "imageName=$imageName" >> $GITHUB_OUTPUT
          echo "the image name: '$imageName'"
          echo "## New version '$version'" >> $GITHUB_STEP_SUMMARY
          echo "## Image '$imageName'" >> $GITHUB_STEP_SUMMARY

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test .

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    needs: [versioning, unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.versioning.outputs.imageRepository }}
          tags: |
            type=raw,value=${{ needs.versioning.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  api-tests:
    runs-on: ubuntu-latest
    needs: [build-and-push, versioning]
    permissions:
      contents: read
      packages: read

    services:
      backend:
        image: ${{ needs.versioning.outputs.imageName }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not start in time"
          exit 1

      - name: API tests
        run: |
          echo "## API tests using ${{ needs.versioning.outputs.imageName }}" >> $GITHUB_STEP_SUMMARY
          go test ./test/apitests
